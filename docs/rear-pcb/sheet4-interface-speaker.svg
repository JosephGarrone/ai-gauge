<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1100 700" width="1100" height="700" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="1100" height="700" fill="#ffffff"/>
  <defs>
    <g id="R"><path d="M0 0H10M40 0H50" stroke="#1f2937" stroke-width="1.6" fill="none"/><rect x="10" y="-5" width="30" height="10" fill="#ffffff" stroke="#1f2937" stroke-width="1.6"/></g>
    <g id="NC" stroke="#b91c1c" stroke-width="1.8"><path d="M-5 -5L5 5M-5 5L5 -5"/></g>
  </defs>

  <text x="20" y="32" font-size="20" font-weight="bold" fill="#111827">Rear PCB · Sheet 4 of 4 — Display header, I²C pull-ups, speaker</text>
  <text x="20" y="54" font-size="13" fill="#4b5563">Planning diagram: not built or verified. Header pinout from Waveshare; speaker from PUI Audio SMS-1308MS-2-R datasheet.</text>

  <g stroke-width="1.6">
    <rect x="60" y="100" width="170" height="260" fill="#e0e7ff" stroke="#3730a3"/>
    <rect x="380" y="490" width="130" height="60" fill="#e0e7ff" stroke="#3730a3"/>
    <rect x="760" y="470" width="310" height="100" fill="#f3f4f6" stroke="#6b7280" stroke-dasharray="6 4"/>
  </g>

  <g stroke="#1f2937" stroke-width="1.6" fill="none">
    <path d="M230 120H300M230 150H300M230 180H300"/>
    <path d="M230 210H250M230 240H250"/>
    <path d="M230 270H300M230 300H300M230 330H300"/>
    <path d="M675 140H690M740 140H760M675 190H690M740 190H760M675 240H690M740 240H760"/>
    <path d="M136 510H380M136 530H380"/>
  </g>
  <g stroke="#6b7280" stroke-width="1.6" fill="none" stroke-dasharray="7 5">
    <path d="M510 510H760M510 530H760"/>
  </g>

  <use href="#NC" xlink:href="#NC" transform="translate(250,210)"/>
  <use href="#NC" xlink:href="#NC" transform="translate(250,240)"/>
  <use href="#R" xlink:href="#R" transform="translate(690,140)"/>
  <use href="#R" xlink:href="#R" transform="translate(690,190)"/>
  <use href="#R" xlink:href="#R" transform="translate(690,240)"/>

  <!-- speaker symbol -->
  <g stroke="#1f2937" stroke-width="1.6">
    <rect x="120" y="500" width="16" height="40" fill="#ffffff"/>
    <path d="M120 500L96 480V560L120 540Z" fill="#ffffff"/>
  </g>

  <g font-size="12" fill="#111827">
    <text x="60" y="92" font-weight="bold">J6  1×8, 2.54 mm → display expansion header</text>
    <text x="68" y="124">1 VBUS</text><text x="68" y="154">2 GND</text><text x="68" y="184">3 3V3</text>
    <text x="68" y="214">4 UART0</text><text x="68" y="244">5 UART0</text>
    <text x="68" y="274">6 SDA *</text><text x="68" y="304">7 SCL *</text><text x="68" y="334">8 ALERT *</text>
    <text x="306" y="124" fill="#1d4ed8" font-weight="bold">VBUS_OUT (U2 pin 6, Sheet 1)</text>
    <text x="306" y="154" fill="#1d4ed8" font-weight="bold">GND</text>
    <text x="306" y="184" fill="#1d4ed8" font-weight="bold">3V3</text>
    <text x="356" y="184" fill="#4b5563">supply for U4, U5 and pull-ups</text>
    <text x="262" y="228" fill="#b91c1c">NC — UART0 stays free for recovery</text>
    <text x="306" y="274" fill="#1d4ed8" font-weight="bold">SDA</text>
    <text x="306" y="304" fill="#1d4ed8" font-weight="bold">SCL</text>
    <text x="306" y="334" fill="#1d4ed8" font-weight="bold">ALERT</text>
    <text x="60" y="382" fill="#4b5563">* Upstream sources disagree on which of GPIO16/17/18 is on pins 6, 7 and 8. The PCB fixes the roles;</text>
    <text x="60" y="398" fill="#4b5563">firmware assigns GPIO numbers after a meter test. Socket or pin header depends on the display's header gender (Q2).</text>

    <text x="640" y="110" font-weight="bold" font-size="13">I²C pull-ups</text>
    <text x="670" y="144" text-anchor="end" fill="#1d4ed8" font-weight="bold">3V3</text>
    <text x="670" y="194" text-anchor="end" fill="#1d4ed8" font-weight="bold">3V3</text>
    <text x="670" y="244" text-anchor="end" fill="#1d4ed8" font-weight="bold">3V3</text>
    <text x="715" y="130" text-anchor="middle">R14 4.7k</text>
    <text x="715" y="180" text-anchor="middle">R15 4.7k</text>
    <text x="715" y="230" text-anchor="middle">R16 10k</text>
    <text x="766" y="144" fill="#1d4ed8" font-weight="bold">SDA</text>
    <text x="766" y="194" fill="#1d4ed8" font-weight="bold">SCL</text>
    <text x="766" y="244" fill="#1d4ed8" font-weight="bold">ALERT</text>
    <text x="640" y="286" font-weight="bold" font-size="13">Bus nets</text>
    <text x="640" y="306">SDA: J6.6 · U4.9 · U5.20 · R14</text>
    <text x="640" y="324">SCL: J6.7 · U4.10 · U5.19 · R15</text>
    <text x="640" y="342">ALERT: J6.8 · U4.2 · R16 (open-drain, ADS1115 only)</text>
    <text x="640" y="360">Speed: 100 kHz maximum (MCP9600 limit)</text>

    <text x="40" y="446" font-weight="bold" font-size="14">Speaker — electrically part of the display, mounted on this board</text>
    <text x="80" y="474" font-weight="bold">LS1  PUI SMS-1308MS-2-R</text>
    <text x="80" y="582">8 Ω ±15 % · 0.7 W rated, 1 W max</text>
    <text x="80" y="598">13 × 13 × 4 mm, SMT</text>
    <text x="146" y="504">LEAD(+)</text><text x="146" y="548">LEAD(−)</text>
    <text x="380" y="482" font-weight="bold">J5  Molex 53047-0210</text>
    <text x="388" y="514">1 SPK_A</text><text x="388" y="534">2 SPK_B</text>
    <text x="380" y="568" fill="#4b5563">PicoBlade 1.25 mm, vertical</text>
    <text x="635" y="500" text-anchor="middle" fill="#4b5563">2-wire MX1.25 ↔ MX1.25 lead</text>
    <text x="770" y="496" font-weight="bold">Display board H3 (MX1.25 2P)</text>
    <text x="770" y="516">NS4150B OUT+ / OUT− · bridged output, 3.3 V supply</text>
    <text x="770" y="536" fill="#b91c1c" font-weight="bold">Never connect either wire to GND</text>
    <text x="770" y="556" fill="#4b5563">Enabled by GPIO46 (PA_CTRL) on the display</text>
  </g>

  <g font-size="12" fill="#111827">
    <text x="40" y="630">LS1 has four pads: LEAD(+), LEAD(−) and two dummy pads. Dummy pads are soldered for strength and connect to no net.</text>
    <text x="40" y="648">PUI suggested land: 4 × pads 2.0 × 3.5 mm, centres 11.2 mm apart (x) and 8.8 mm apart (y). The drawing shows the leads from below — mirror for the top-side footprint.</text>
    <text x="40" y="666">Speaker polarity does not matter for a single speaker. MX1.25 is a PicoBlade-compatible family: confirm the lead mates with the display's H3 before ordering.</text>
    <text x="40" y="684">No KiCad library footprint exists for LS1 — create one from the PUI drawing.</text>
  </g>
</svg>
