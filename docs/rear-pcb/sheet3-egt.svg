<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1000 640" width="1000" height="640" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="1000" height="640" fill="#ffffff"/>
  <defs>
    <g id="C" stroke="#1f2937" fill="none"><path d="M0 0H21M29 0H50" stroke-width="1.6"/><path d="M21 -10V10M29 -10V10" stroke-width="2.4"/></g>
    <g id="GND" stroke="#1f2937" stroke-width="1.6" fill="none"><path d="M0 0V8M-10 8H10M-6 12H6M-2 16H2"/></g>
    <g id="NC" stroke="#b91c1c" stroke-width="1.8"><path d="M-5 -5L5 5M-5 5L5 -5"/></g>
  </defs>

  <text x="20" y="32" font-size="20" font-weight="bold" fill="#111827">Rear PCB · Sheet 3 of 4 — EGT thermocouple, MCP9600</text>
  <text x="20" y="54" font-size="13" fill="#4b5563">Planning diagram: not built or verified. Pin numbers from Microchip MCP960X datasheet DS20005426G, Table 3-1 (MQFN-20).</text>

  <g stroke-width="1.6">
    <rect x="40" y="180" width="150" height="100" fill="#e0e7ff" stroke="#3730a3"/>
    <rect x="420" y="110" width="280" height="390" fill="#fef9c3" stroke="#854d0e"/>
  </g>

  <g stroke="#1f2937" stroke-width="1.6" fill="none">
    <path d="M190 205H420M190 255H420"/>
    <path d="M420 340H380V440M420 380H380M420 420H380"/>
    <path d="M700 140H820"/>
    <path d="M700 230H860M700 270H860"/>
    <path d="M700 310H740"/>
    <path d="M700 360H720M700 390H720M700 420H720M700 450H720"/>
  </g>

  <use href="#C" xlink:href="#C" transform="translate(330,205) rotate(90)"/>
  <use href="#GND" xlink:href="#GND" transform="translate(380,440)"/>
  <use href="#C" xlink:href="#C" transform="translate(760,140) rotate(90)"/>
  <use href="#GND" xlink:href="#GND" transform="translate(760,190)"/>
  <use href="#NC" xlink:href="#NC" transform="translate(720,360)"/>
  <use href="#NC" xlink:href="#NC" transform="translate(720,390)"/>
  <use href="#NC" xlink:href="#NC" transform="translate(720,420)"/>
  <use href="#NC" xlink:href="#NC" transform="translate(720,450)"/>

  <g fill="#1f2937">
    <circle cx="330" cy="205" r="3.2"/><circle cx="330" cy="255" r="3.2"/>
    <circle cx="380" cy="380" r="3.2"/><circle cx="380" cy="420" r="3.2"/><circle cx="760" cy="140" r="3.2"/>
  </g>

  <g font-size="12" fill="#111827">
    <text x="40" y="172" font-weight="bold">J4  JST B2B-PH-K-S  (thermocouple)</text>
    <text x="48" y="209">1 TC+</text><text x="48" y="259">2 TC−</text>
    <text x="40" y="298" fill="#4b5563">Silkscreen “+” and “−”. This copper</text>
    <text x="40" y="314" fill="#4b5563">joint is the cold junction: place J4</text>
    <text x="40" y="330" fill="#4b5563">right beside U5, away from U1 and L1.</text>
    <text x="220" y="199" fill="#1d4ed8" font-weight="bold">TC+</text>
    <text x="220" y="249" fill="#1d4ed8" font-weight="bold">TC−</text>
    <text x="348" y="228">C16 10nF C0G</text>
    <text x="348" y="242" fill="#4b5563">optional, DNP</text>

    <text x="420" y="102" font-weight="bold">U5  MCP9600-E/MX  (MQFN-20, 5 × 5 mm) · I²C 0x67</text>
    <text x="428" y="209">2 VIN+</text><text x="428" y="259">4 VIN−</text>
    <text x="428" y="344">1, 3, 5, 13, 17  GND</text>
    <text x="428" y="384">6, 7, 9, 10, 18  GND†</text>
    <text x="428" y="424">21  EP</text>
    <text x="692" y="144" text-anchor="end">VDD 8</text>
    <text x="692" y="234" text-anchor="end">SDA 20</text><text x="692" y="274" text-anchor="end">SCL 19</text>
    <text x="692" y="314" text-anchor="end">ADDR 16</text>
    <text x="692" y="364" text-anchor="end">Alert 1  11</text><text x="692" y="394" text-anchor="end">Alert 2  12</text>
    <text x="692" y="424" text-anchor="end">Alert 3  14</text><text x="692" y="454" text-anchor="end">Alert 4  15</text>

    <text x="826" y="144" fill="#1d4ed8" font-weight="bold">3V3</text>
    <text x="776" y="176">C15 0.1µF</text>
    <text x="866" y="234" fill="#1d4ed8" font-weight="bold">SDA</text>
    <text x="866" y="274" fill="#1d4ed8" font-weight="bold">SCL</text>
    <text x="746" y="314" fill="#1d4ed8" font-weight="bold">3V3</text>
    <text x="786" y="314" fill="#4b5563">(ADDR = VDD → 0x67)</text>
    <text x="736" y="394" fill="#b91c1c">NC — alerts are push-pull</text>
    <text x="736" y="410" fill="#b91c1c">outputs: never join them to</text>
    <text x="736" y="426" fill="#b91c1c">the shared ALERT net</text>
  </g>

  <g font-size="12" fill="#111827">
    <text x="40" y="540" font-weight="bold" font-size="13">Notes</text>
    <text x="40" y="560">† Microchip: pins 6, 7, 9, 10, 18 are “not electrical ground; must be tied to ground”. EP must be connected to GND.</text>
    <text x="40" y="578">I²C serial port frequency is 10–100 kHz on MCP9600, so the whole sensor bus (I2C_NUM_1) must run at 100 kHz, not 400 kHz.</text>
    <text x="40" y="596">Footprint: Microchip land pattern C04-186B (0.65 mm pitch, 0.40 × 0.55 mm pads, 3.35 mm centre pad) ≈ KiCad QFN-20-1EP_5x5mm_P0.65mm_EP3.35x3.35mm.</text>
    <text x="40" y="614">C15 and C16 are design choices; the datasheet gives no decoupling or input-filter values. C16 is footprint only unless noise is measured.</text>
  </g>
</svg>
