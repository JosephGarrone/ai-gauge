  <g font-size="12" fill="#111827">
    <text x="246" y="124" text-anchor="end" fill="#1d4ed8" font-weight="bold">+5V (Sheet 1)</text>
    <text x="258" y="202" text-anchor="end">C9 0.1µF</text>
    <text x="320" y="92" font-weight="bold">U3  TPS2553DBVR  (SOT-23-6)</text>
    <text x="328" y="124">1 IN</text><text x="328" y="154">3 EN</text><text x="328" y="194">2 GND</text>
    <text x="482" y="124" text-anchor="end">OUT 6</text><text x="482" y="154" text-anchor="end">FAULT 4</text>
    <text x="482" y="194" text-anchor="end">ILIM 5</text>
    <text x="518" y="154" fill="#b91c1c">NC</text>
    <text x="515" y="180" text-anchor="middle">R4 232k</text>
    <text x="620" y="204" text-anchor="middle">C10 1µF</text>
    <text x="668" y="240" fill="#1d4ed8" font-weight="bold">+5V_SNS</text>

    <text x="40" y="222" font-weight="bold">J3  JST B3B-PH-K-S  (MAP sensor)</text>
    <text x="48" y="259">1 GND (black)</text><text x="48" y="289">2 SIG (white)</text><text x="48" y="319">3 +5V (red)</text>
    <text x="200" y="279" fill="#1d4ed8" font-weight="bold">MAP_SIG</text>

    <!-- AIN0 labels -->
    <text x="425" y="408" text-anchor="middle">R5 10k</text>
    <text x="462" y="452" text-anchor="end">R6 10k</text>
    <text x="515" y="408" text-anchor="middle">R7 1k</text>
    <text x="558" y="504" text-anchor="end">C11 10nF</text>
    <text x="628" y="364" fill="#1d4ed8" font-weight="bold">3V3</text>
    <text x="632" y="446">D3 BAT54S</text>
    <text x="632" y="460" font-size="10.5" fill="#4b5563">3 = node · 2 = 3V3 · 1 = GND</text>
    <text x="930" y="412" fill="#1d4ed8" font-weight="bold">AIN0</text>
    <!-- AIN1 labels -->
    <text x="425" y="568" text-anchor="middle">R8 10k</text>
    <text x="462" y="612" text-anchor="end">R9 10k</text>
    <text x="515" y="568" text-anchor="middle">R10 1k</text>
    <text x="558" y="664" text-anchor="end">C12 10nF</text>
    <text x="628" y="524" fill="#1d4ed8" font-weight="bold">3V3</text>
    <text x="632" y="606">D4 BAT54S</text>
    <text x="632" y="620" font-size="10.5" fill="#4b5563">3 = node · 2 = 3V3 · 1 = GND</text>
    <text x="930" y="572" fill="#1d4ed8" font-weight="bold">AIN1</text>
    <!-- AIN2 labels -->
    <text x="296" y="744" text-anchor="end" fill="#1d4ed8" font-weight="bold">IGN_F (Sheet 1)</text>
