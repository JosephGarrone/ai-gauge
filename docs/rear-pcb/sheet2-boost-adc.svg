    <text x="462" y="772" text-anchor="end">R12 20k</text>
    <text x="515" y="728" text-anchor="middle">R13 1k</text>
    <text x="558" y="824" text-anchor="end">C13 10nF</text>
    <text x="628" y="684" fill="#1d4ed8" font-weight="bold">3V3</text>
    <text x="632" y="766">D5 BAT54S</text>
    <text x="632" y="780" font-size="10.5" fill="#4b5563">3 = node · 2 = 3V3 · 1 = GND</text>
    <text x="930" y="732" fill="#1d4ed8" font-weight="bold">AIN2</text>

    <text x="1000" y="372" font-weight="bold">U4  ADS1115IDGSR  (VSSOP-10) · I²C 0x48</text>
    <text x="1008" y="424">4 AIN0</text><text x="1008" y="584">5 AIN1</text>
    <text x="1008" y="744">6 AIN2</text><text x="1008" y="784">7 AIN3</text>
    <text x="1202" y="424" text-anchor="end">VDD 8</text><text x="1202" y="504" text-anchor="end">SDA 9</text>
    <text x="1202" y="544" text-anchor="end">SCL 10</text><text x="1202" y="584" text-anchor="end">ALERT/RDY 2</text>
    <text x="1202" y="664" text-anchor="end">ADDR 1</text><text x="1202" y="744" text-anchor="end">GND 3</text>
    <text x="1306" y="424" fill="#1d4ed8" font-weight="bold">3V3</text>
    <text x="1276" y="456">C14 0.1µF</text>
    <text x="1326" y="504" fill="#1d4ed8" font-weight="bold">SDA</text>
    <text x="1326" y="544" fill="#1d4ed8" font-weight="bold">SCL</text>
    <text x="1326" y="584" fill="#1d4ed8" font-weight="bold">ALERT</text>
    <text x="1248" y="652">0x48</text>
  </g>

  <g font-size="12" fill="#111827">
    <text x="720" y="110" font-weight="bold" font-size="13">Channel map (firmware)</text>
    <text x="720" y="130">AIN0 = MAP_SIG ÷ 2   (R5/R6 10k/10k)</text>
    <text x="720" y="148">AIN1 = +5V_SNS ÷ 2   (R8/R9 10k/10k) — sensor supply monitor</text>
    <text x="720" y="166">AIN2 = IGN_F ÷ 6   (R11/R12 100k/20k) — ignition voltage, reads to ≈19.8 V</text>
    <text x="720" y="184">AIN3 = GND (unused; TI allows GND or floating)</text>
    <text x="720" y="202">MAP ratio = AIN0 / AIN1 → cancels 5 V supply error (ratiometric sensor)</text>
    <text x="720" y="228" font-weight="bold" font-size="13">Limits and values</text>
    <text x="720" y="248">ADS1115 inputs: GND − 0.3 V to VDD + 0.3 V (3.6 V at 3V3). R7/R10/R13 + BAT54S clamp faults.</text>
    <text x="720" y="266">MAP_SIG shorted to 12 V → 6 V at the divider → ≈0.4 mA into the clamp.</text>
    <text x="720" y="284">U3 current limit with R4 = 232k: 100 / 117 / 137 mA (min / nom / max, TI equations).</text>
    <text x="720" y="302">R: 1 %, 0603 · C11–C13 10 nF C0G · C9, C14 100 nF X7R · C10 1 µF X7R</text>
    <text x="720" y="320">U3 EN is active-high on TPS2553 (tied to IN). FAULT is open-drain; unused.</text>
  </g>
</svg>
