# On a v* tag: attach binaries to a GitHub Release, then republish the GitHub Pages site so the
# flashing page serves the new firmware. The site itself is assembled by pages.yml, which also
# carries the face editor. See docs/ci-release.md.
name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  release:
    name: build and release
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.value }}
    steps:
      - uses: actions/checkout@v4

      - name: Derive version
        id: version
        run: echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Build
        uses: espressif/esp-idf-ci-action@v1
        env:
          AI_GAUGE_VERSION: ${{ steps.version.outputs.value }}
        with:
          esp_idf_version: v5.5.1
          target: esp32s3
          path: firmware
          command: |
            idf.py build &&
            cd build &&
            esptool.py --chip esp32s3 merge_bin -o ai-gauge-merged.bin @flash_args

      # What a gauge reads to decide whether to update (net_svc_update.c). It fetches this through
      # /releases/latest/download/ota.json, then downloads ai-gauge.bin from the tag named here.
      # The version must equal the one compiled into the image, or the gauge refuses it. Written
      # outside firmware/build, which the build container leaves owned by root.
      - name: Write OTA manifest
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          size=$(stat -c %s firmware/build/ai-gauge.bin)
          sha=$(sha256sum firmware/build/ai-gauge.bin | cut -d' ' -f1)
          printf '{"version":"%s","tag":"%s","app":"ai-gauge.bin","size":%s,"sha256":"%s"}\n' \
            "${VERSION}" "${GITHUB_REF_NAME}" "${size}" "${sha}" > ota.json
          cat ota.json

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            ota.json
            firmware/build/ai-gauge-merged.bin
            firmware/build/ai-gauge.bin
            firmware/build/bootloader/bootloader.bin
            firmware/build/partition_table/partition-table.bin
            firmware/build/storage.bin

  # The flashing page downloads ai-gauge-merged.bin from the release just published.
  pages:
    name: publish Pages site
    needs: release
    uses: ./.github/workflows/pages.yml
    with:
      tag: ${{ github.ref_name }}
